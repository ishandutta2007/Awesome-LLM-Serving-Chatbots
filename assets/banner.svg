<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <!-- Vibrant Gradient for Title & Accents -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Accent Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.8" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.28; }
      50% { transform: scale(1.12); opacity: 0.45; }
    }
    @keyframes floatParticle1 {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-22px) translateX(12px); opacity: 0.85; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes floatParticle2 {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
      50% { transform: translateY(-30px) translateX(-18px); opacity: 0.9; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes beacon {
      0%, 100% { r: 4px; opacity: 0.6; }
      50% { r: 7px; opacity: 1; }
    }
    .orb-glow {
      transform-origin: center;
      animation: pulseOrb 6s ease-in-out infinite;
    }
    .particle-1 { animation: floatParticle1 4.5s ease-in-out infinite; }
    .particle-2 { animation: floatParticle2 6s ease-in-out infinite; }
    .flow-path {
      stroke-dasharray: 12, 10;
      animation: flowLine 7s linear infinite;
    }
    .beacon-dot {
      animation: beacon 3s ease-in-out infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.8px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      letter-spacing: 0.2px;
      fill: #94a3b8;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #cbd5e1;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />
  
  <!-- Subtle Grid overlay -->
  <rect width="1200" height="360" fill="url(#gridPattern)" rx="16" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="1020" cy="90" r="140" fill="#38bdf8" filter="url(#glow)" class="orb-glow" />
  <circle cx="150" cy="280" r="120" fill="#818cf8" filter="url(#glow)" class="orb-glow" style="animation-delay: -3s;" />
  <circle cx="980" cy="270" r="110" fill="#c084fc" filter="url(#glow)" class="orb-glow" style="animation-delay: -1.5s;" />

  <!-- Dynamic Animated Graph & Flow Curves behind text -->
  <g opacity="0.45">
    <path class="flow-path" d="M 60,80 Q 300,10 600,70 T 1140,80" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="flow-path" d="M 60,300 Q 350,330 650,290 T 1140,290" fill="none" stroke="#a855f7" stroke-width="2" style="animation-direction: reverse;" />
    <path class="flow-path" d="M 100,180 C 400,240 800,100 1120,200" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.5" />
  </g>

  <!-- Dynamic Floating Nodes & Beacons -->
  <g>
    <circle cx="280" cy="65" r="5" fill="#38bdf8" class="beacon-dot" />
    <circle cx="880" cy="75" r="5" fill="#818cf8" class="beacon-dot" style="animation-delay: 1s;" />
    <circle cx="1060" cy="180" r="6" fill="#c084fc" class="beacon-dot" style="animation-delay: 1.8s;" />
    <circle cx="140" cy="190" r="4" fill="#34d399" class="beacon-dot" style="animation-delay: 0.5s;" />

    <!-- Ambient particles -->
    <circle cx="340" cy="140" r="3" fill="#38bdf8" class="particle-1" />
    <circle cx="750" cy="100" r="3.5" fill="#a78bfa" class="particle-2" />
    <circle cx="920" cy="240" r="3" fill="#f472b6" class="particle-1" style="animation-delay: 2s;" />
    <circle cx="480" cy="270" r="2.5" fill="#38bdf8" class="particle-2" style="animation-delay: 1.2s;" />
  </g>

  <!-- Main Content in Foreground (Always Visible & High Contrast) -->
  <g>
    <!-- Top Super-Badge Pill -->
    <g transform="translate(600, 52)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="url(#pillGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" />
      <circle cx="-116" cy="0" r="4.5" fill="#22c55e" />
      <text x="-98" y="5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="1.2">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title (Gradient Fill + Drop Shadow) -->
    <text x="600" y="132" text-anchor="middle" class="title-text" fill="url(#primaryGrad)">Awesome LLM Serving &amp; Chatbots</text>

    <!-- Subtitle -->
    <text x="600" y="176" text-anchor="middle" class="sub-text">High-Throughput Inference Engines • Managed SaaS Platforms • Scalable Chatbot Frameworks</text>

    <!-- Interactive/Feature Badges Row -->
    <g transform="translate(210, 222)">
      <!-- Pill 1: High-Throughput Serving -->
      <g transform="translate(0, 0)">
        <rect width="180" height="42" rx="10" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2" />
        <circle cx="24" cy="21" r="5" fill="#38bdf8" />
        <text x="40" y="26" class="tag-text">vLLM &amp; PagedAttention</text>
      </g>
      <!-- Pill 2: RadixAttention & SGLang -->
      <g transform="translate(195, 0)">
        <rect width="185" height="42" rx="10" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2" />
        <circle cx="24" cy="21" r="5" fill="#818cf8" />
        <text x="40" y="26" class="tag-text">SGLang &amp; RadixAttention</text>
      </g>
      <!-- Pill 3: Production Rust TGI -->
      <g transform="translate(395, 0)">
        <rect width="185" height="42" rx="10" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2" />
        <circle cx="24" cy="21" r="5" fill="#c084fc" />
        <text x="40" y="26" class="tag-text">Hugging Face TGI</text>
      </g>
      <!-- Pill 4: Local & Edge Ollama / Llama.cpp -->
      <g transform="translate(595, 0)">
        <rect width="185" height="42" rx="10" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2" />
        <circle cx="24" cy="21" r="5" fill="#34d399" />
        <text x="40" y="26" class="tag-text">Ollama &amp; llama.cpp</text>
      </g>
    </g>

    <!-- Bottom Stat / Focus Line -->
    <text x="600" y="315" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="13" font-weight="500" fill="#64748b" letter-spacing="0.5">
      🚀 Self-Hosted Runtimes &nbsp;•&nbsp; ⚡ Serverless GPU Clouds &nbsp;•&nbsp; 💬 Conversational UIs &nbsp;•&nbsp; 🌐 OpenAI-Compatible APIs
    </text>
  </g>
</svg>